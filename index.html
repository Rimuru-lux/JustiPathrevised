<style>
/* Layout: a phone-shaped app column (header, scrolling screen, bottom tabs). Navy civic palette, red reserved for emergencies. */
:root {
  --bg: #F2F5FA; --surface: #FFFFFF; --surface-2: #EAF0F9; --ink: #14213D; --muted: #566277; --line: #D9E1EC;

  --gold: #E9B63C; --on-gold: #3A2B00;
  --red: #C62839; --on-red: #FFFFFF; --red-soft: #FBE7EA;
  --green: #1D7A4C; --green-soft: #E2F4EA; --amber: #8A5B00; --amber-soft: #FFF2D6;
  --c-theft: #2F6BD0; --c-theft-bg: #E3ECFB;
  --c-abuse: #8E3F8B; --c-abuse-bg: #F5E6F4;

  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 6px 18px rgba(20,33,61,.07);
  --font-d: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-b: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1424; --surface: #15203A; --surface-2: #1C2A48; --ink: #EAF0FA; --muted: #A2AFC6; --line: #2B3A58;
    --brand: #4A7FDB; --on-brand: #06122A; --brand-ink: #8FB5F7; --bar-bg: #101C36; --bar-ink: #EAF0FA; --tbtn: rgba(255,255,255,.12); --brand-soft: #1F3157; --link: #8FB5F7;
    --gold: #EFC25A; --on-gold: #2A1F00;
    --red: #E5495A; --on-red: #1A0408; --red-soft: #3A1620;
    --green: #4FC088; --green-soft: #153A2A; --amber: #F0BC55; --amber-soft: #3B2D10;
    --c-theft: #7DA8F5; --c-theft-bg: #1B2C50; --c-abuse: #D18CCD; --c-abuse-bg: #3A2039;
    --c-online: #5CCAD6; --c-online-bg: #123A40; --c-wages: #F0A855; --c-wages-bg: #40290F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1424; --surface: #15203A; --surface-2: #1C2A48; --ink: #EAF0FA; --muted: #A2AFC6; --line: #2B3A58;
  --brand: #4A7FDB; --on-brand: #06122A; --brand-ink: #8FB5F7; --bar-bg: #101C36; --bar-ink: #EAF0FA; --tbtn: rgba(255,255,255,.12); --brand-soft: #1F3157; --link: #8FB5F7;
  --gold: #EFC25A; --on-gold: #2A1F00;
  --red: #E5495A; --on-red: #1A0408; --red-soft: #3A1620;
  --green: #4FC088; --green-soft: #153A2A; --amber: #F0BC55; --amber-soft: #3B2D10;
  --c-theft: #7DA8F5; --c-theft-bg: #1B2C50; --c-abuse: #D18CCD; --c-abuse-bg: #3A2039;
  --c-online: #5CCAD6; --c-online-bg: #123A40; --c-wages: #F0A855; --c-wages-bg: #40290F;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); color-scheme: dark;
}
:root[data-hc="1"] { --muted: var(--ink); --line: var(--ink); }
:root[data-size="l"] { font-size: 112.5%; }
:root[data-size="xl"] { font-size: 125%; }

* { box-sizing: border-box; }
html, body { height: 100%; }
html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }

p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; } .ic.lg { width: 30px; height: 30px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }
@media (min-width: 520px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 10px max(16px, env(safe-area-inset-right, 0px)); background: var(--bar-bg); color: var(--bar-ink); min-height: 56px; }
.topbar h1 { font-size: 1.15rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 8px; flex: 1; font-family: var(--font-d); font-weight: 800; font-size: 1.25rem; letter-spacing: -.02em; }
.brand .mark { width: 30px; height: 30px; }
.tbtn { background: var(--tbtn); border: 0; color: inherit; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.tbtn:hover { filter: brightness(1.25); }
.exitbtn { background: var(--gold); color: var(--on-gold); width: auto; padding: 0 12px; gap: 6px; font-weight: 700; font-size: .8rem; display: flex; align-items: center; }
main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-left, 0px)) 4px max(8px, env(safe-area-inset-right, 0px)); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: .72rem; font-weight: 600; color: var(--muted); border-radius: 12px; min-width: 0; position: relative; }
.nav button[aria-current="page"] { color: var(--brand-ink); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: -5px; width: 28px; height: 3px; border-radius: 2px; background: var(--gold); }
.dot { position: absolute; top: 4px; right: calc(50% - 20px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--red); color: var(--on-red); font-size: .65rem; display: grid; place-items: center; padding: 0 4px; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.pad0 { padding: 0; overflow: hidden; gap: 0; }
.lede { color: var(--muted); font-size: .9rem; }
.h2 { font-size: 1.15rem; } .h3 { font-size: 1rem; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h a, .linkbtn { background: none; border: 0; color: var(--link); font-weight: 600; font-size: .85rem; padding: 4px 0; text-decoration: none; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 0 12px; }
.search:focus-within { border-color: var(--brand); }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 13px 0; font: inherit; color: var(--ink); outline: none; }
.search .ic { color: var(--muted); }
.sosbtn { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: var(--red); color: var(--on-red); border-radius: 16px; padding: 14px 16px; font-weight: 800; font-family: var(--font-d); font-size: 1.1rem; text-align: left; box-shadow: var(--shadow); }
.sosbtn small { display: block; font-family: var(--font-b); font-weight: 500; font-size: .8rem; opacity: .92; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.casebtn { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.casebtn:hover { border-color: var(--brand); }
.casebtn h3 { font-size: .95rem; }
.casebtn p { font-size: .78rem; color: var(--muted); }
.ibox { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-ink); flex: none; }
.ibox.theft { background: var(--c-theft-bg); color: var(--c-theft); } .ibox.abuse { background: var(--c-abuse-bg); color: var(--c-abuse); }
.ibox.online { background: var(--c-online-bg); color: var(--c-online); } .ibox.wages { background: var(--c-wages-bg); color: var(--c-wages); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; text-align: center; min-width: 0; }
.tile:hover { border-color: var(--brand); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 700; font-size: .92rem; }
.row .s { font-size: .8rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .chev { color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .8rem; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"], .chip.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); white-space: nowrap; }
.badge.open { background: var(--green-soft); color: var(--green); } .badge.closed { background: var(--red-soft); color: var(--red); }
.badge.warn { background: var(--amber-soft); color: var(--amber); } .badge.ok { background: var(--green-soft); color: var(--green); }
.badge.theft { background: var(--c-theft-bg); color: var(--c-theft); } .badge.abuse { background: var(--c-abuse-bg); color: var(--c-abuse); }
.badge.online { background: var(--c-online-bg); color: var(--c-online); } .badge.wages { background: var(--c-wages-bg); color: var(--c-wages); }
.bar { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--brand); color: var(--on-brand); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 44px; }
.btn.sec { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.red { background: var(--red); color: var(--on-red); } .btn.block { width: 100%; }
.btn.sm { padding: 8px 12px; min-height: 36px; font-size: .85rem; } .btn[disabled] { opacity: .5; cursor: not-allowed; }
.note { display: flex; gap: 10px; align-items: flex-start; border-radius: 12px; padding: 10px 12px; font-size: .82rem; background: var(--amber-soft); color: var(--ink); border: 1px solid var(--line); }
.note.info { background: var(--brand-soft); } .note.red { background: var(--red-soft); }
.note .ic { margin-top: 2px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; background: var(--surface-2); padding: 4px; border-radius: 14px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: .82rem; white-space: nowrap; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.hero { background: var(--brand); color: var(--on-brand); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: var(--gold); opacity: .18; }
.hero h2 { font-size: 1.4rem; }
.hero p { opacity: .9; font-size: .88rem; max-width: 30ch; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.step .n { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-family: var(--font-d); font-weight: 800; }
.step .x { font-size: .8rem; color: var(--muted); margin-top: 4px; }
.step .x b { color: var(--ink); }
.check { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.check:last-child { border-bottom: 0; }
.box { width: 24px; height: 24px; border: 2px solid var(--muted); border-radius: 7px; display: grid; place-items: center; flex: none; margin-top: 1px; }
.check[aria-checked="true"] .box { background: var(--green); border-color: var(--green); color: var(--bg); }
.check[aria-checked="true"] .lbl { text-decoration: line-through; color: var(--muted); }
.progress { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--green); border-radius: 4px; transition: width .25s; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-weight: 600; font-size: .85rem; }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; background: var(--surface); color: var(--ink); min-width: 0; }
.field input:focus, .field select:focus { outline: none; border-color: var(--brand); }
.field .err { color: var(--red); font-size: .8rem; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.switch:last-child { border-bottom: 0; }
.tg { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] .tg { background: var(--green); } .switch[aria-checked="true"] .tg::after { transform: translateX(18px); }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--surface); padding: 8px 10px; font-weight: 600; font-size: .82rem; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.sheet-bg { position: absolute; inset: 0; background: rgba(8,14,28,.55); display: flex; align-items: flex-end; z-index: 30; }
.sheet { background: var(--bg); width: 100%; max-height: 88%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet > * { flex-shrink: 0; }
.sheet { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
.numrow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.numrow:last-child { border-bottom: 0; }
.num { font-family: var(--font-d); font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; user-select: all; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 82%; padding: 9px 12px; border-radius: 16px; font-size: .9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--brand); color: var(--on-brand); border-bottom-right-radius: 4px; }
.msg.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg small { display: block; opacity: .65; font-size: .68rem; margin-top: 2px; }
.composer { display: flex; gap: 8px; padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 22px; padding: 10px 14px; font: inherit; background: var(--bg); color: var(--ink); }
.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .85rem; z-index: 50; max-width: 90%; box-shadow: var(--shadow); }
.full { position: absolute; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; display: flex; flex-direction: column; }
.cover { min-height: 100%; padding: 28px max(20px, env(safe-area-inset-left, 0px)) 28px max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; justify-content: center; }
.cover .logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-d); font-weight: 800; font-size: 2rem; letter-spacing: -.03em; color: var(--brand-ink); }
.cover .logo svg { width: 46px; height: 46px; }
.dpa { max-height: 260px; overflow-y: auto; font-size: .85rem; display: flex; flex-direction: column; gap: 8px; }
.dpa h4 { font-size: .9rem; }
.flag { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--brand) 0 40%, var(--red) 40% 70%, var(--gold) 70%); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: .88rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
.weather { background: linear-gradient(#5aa6e8, #8ec9f5); color: #0b2a4a; min-height: 100%; padding: 40px 24px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.weather .big { font-size: 4rem; font-family: var(--font-d); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ===== Design B: guide character, list menu, bottom search ===== */
.nav { grid-template-columns: repeat(5, 1fr); }
.brand-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.brand-wrap .brand { flex: none; }
.tagline { font-size: .66rem; line-height: 1.25; opacity: .85; font-weight: 500; margin-left: 38px; margin-top: -2px; }
.exitbtn span.xl { display: inline; }
@media (max-width: 430px) { .topbar .exitbtn { font-size: 0; gap: 0; padding: 0; width: 36px; height: 36px; justify-content: center; } }
.topbar .tbtn.sm { width: 36px; height: 36px; position: relative; }
.topbar .bdot { position: absolute; top: 3px; right: 3px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--red); color: #fff; font-size: .62rem; display: grid; place-items: center; padding: 0 3px; }
.guide { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: end; }
.mascot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mascot svg { width: 84px; height: 96px; }
.mascot span { font-size: .72rem; font-weight: 700; color: var(--brand-ink); background: var(--brand-soft); padding: 2px 10px; border-radius: 999px; }
.bubble { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; border-bottom-left-radius: 4px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.bubble::before { content: ""; position: absolute; left: -9px; bottom: 14px; width: 14px; height: 14px; background: var(--surface); border-left: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); transform: rotate(45deg); border-bottom-left-radius: 4px; }
.msgbtn { background: none; border: 0; padding: 0; text-align: left; font-size: 1rem; line-height: 1.35; color: var(--ink); display: block; width: 100%; }
.msgbtn small { display: block; font-size: .7rem; color: var(--muted); margin-top: 3px; font-weight: 500; }
.bubble.sos { border-color: var(--red); background: var(--red-soft); }
.bubble.sos::before { background: var(--red-soft); border-color: var(--red); }
.bubble.sos .msgbtn b { color: var(--red); font-size: 1.1rem; }
.bubble .msgt { font-size: .9rem; }

    if (have) { JP.save(); return; }
    const str = await idb("readonly", st => st.get(KEY));
    if (str) { try { localStorage.setItem(KEY, str); } catch (e) {} try { JP.D = JSON.parse(str); const base = DEF(); for (const k in base) if (JP.D[k] === undefined) JP.D[k] = base[k]; JP.D.set = Object.assign(base.set, JP.D.set); mem = JP.D; } catch (e) {} }
  };
  window.addEventListener("pagehide", () => { try { JP.save(); } catch (e) {} });
  JP.load();

  /* ---------- state ---------- */
  JP.S = { route: { name: "home", params: {} }, stack: [], sheet: null, toast: null, neutral: false, gate: null };

  /* ---------- helpers ---------- */
  JP.esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  JP.ic = (n, c) => '<svg class="ic ' + (c || "") + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
  JP.lang = () => JP.D.set.lang;
  JP.t = s => (JP.D.set.lang === "fil" && JP.FIL && JP.FIL[s]) || s;
  JP.cname = c => { const o = JP.CASES.find(x => x.id === c); return o ? o[JP.lang()] || o.en : c; };
  JP.cobj = c => JP.CASES.find(x => x.id === c);
  JP.toast = function (m) { JP.S.toast = m; JP.render(); clearTimeout(JP._tt); JP._tt = setTimeout(() => { JP.S.toast = null; const el = document.querySelector(".toast"); if (el) el.remove(); }, 2200); };

  /* ---------- Philippine time and office hours ---------- */
  JP.phNow = function () {
    const p = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Manila", weekday: "short", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(new Date());
    const g = k => p.find(x => x.type === k).value;
    const dow = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 }[g("weekday")];
    return { dow, h: (+g("hour")) % 24, m: +g("minute") };
  };
  const ampm = h => (h % 12 || 12) + ":00 " + (h < 12 ? "AM" : "PM");
  JP.hoursText = h => h.t ? JP.t("Open 24 hours") : JP.t("Mon to Fri") + ", " + ampm(h.from) + " to " + ampm(h.to);
  JP.status = function (h) {
    if (h.t) return { open: true, label: JP.t("Open now") };
    const n = JP.phNow(), mins = n.h * 60 + n.m;
    const open = h.d.includes(n.dow) && mins >= h.from * 60 && mins < h.to * 60;
    return { open, label: open ? JP.t("Open now") + ", " + JP.t("until") + " " + ampm(h.to) : JP.t("Closed now") + ", " + JP.t("opens") + " " + ampm(h.from) };
  };
  JP.supportOnline = () => JP.status({ d: [1, 2, 3, 4, 5], from: 8, to: 17 }).open;

  /* ---------- content index ---------- */
  JP.TYPES = {
    right: { label: "Rights", icon: "shield", src: () => JP.RIGHTS, one: "Right" },
    law: { label: "Laws", icon: "scale", src: () => JP.LAWS, one: "Law" },
    office: { label: "Institutions", icon: "building", src: () => JP.OFFICES, one: "Institution" },
    hotline: { label: "Hotlines", icon: "phone", src: () => JP.HOTLINES, one: "Hotline" },
    req: { label: "Requirements", icon: "list", src: () => JP.REQS, one: "Requirements" },
    guide: { label: "Guides", icon: "route", src: () => JP.GUIDES, one: "Guide" },
    link: { label: "Reporting links", icon: "link", src: () => JP.LINKS, one: "Reporting link" }
  };
  JP.buildIndex = function () {
    JP.ALL = []; JP.BY = {};
    for (const k in JP.TYPES) JP.TYPES[k].src().forEach(o => { o.type = k; JP.ALL.push(o); JP.BY[o.id] = o; });
  };
  JP.buildIndex();
  JP.ofType = (ty, c) => JP.ALL.filter(o => o.type === ty && (!c || o.cases.includes(c)));
  JP.itemSub = o => o.type === "hotline" ? o.num : o.type === "law" ? o.num : o.type === "office" ? o.addr : o.type === "right" ? o.law : o.type === "link" ? o.url.replace("https://", "") : (o.sum || "");
  JP.related = function (o, max) {
    const out = [], seen = new Set([o.id]);
    (o.rel || []).forEach(id => { const x = JP.BY[id]; if (x && !seen.has(id)) { out.push(x); seen.add(id); } });
    JP.ALL.forEach(x => { if (out.length < (max || 8) && !seen.has(x.id) && x.cases.some(c => o.cases.includes(c)) && ["req", "guide", "office", "hotline"].includes(x.type) && x.type !== o.type) { out.push(x); seen.add(x.id); } });
    return out;
  };

  /* ---------- search (English and Filipino keywords) ---------- */
  const STOP = new Set("the a an my me i is are to of for and or in on at wont won't dont didnt didn't no not how what where do does can pa na ang ng sa ko ako ay mga ako ba po".split(" "));
  const norm = s => String(s).toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9ñ\s-]/g, " ");
  JP.tokens = q => norm(q).split(/\s+/).filter(w => w.length > 1 && !STOP.has(w));
  JP.search = function (q, f) {
    f = f || {}; const toks = JP.tokens(q || ""), res = [];
    JP.ALL.forEach(o => {
      if (f.type && o.type !== f.type) return; if (f.c && !o.cases.includes(f.c)) return;
      if (!toks.length) { res.push({ o, s: 0 }); return; }
      const title = norm(o.title), hay = norm([o.title, o.sum || "", o.tags || "", o.num || "", o.addr || "", o.law || "", (o.pts || []).join(" "), (o.items || []).join(" "), (o.steps || []).map(s => s.t + " " + s.d).join(" ")].join(" "));
      const ctags = norm(o.cases.map(c => JP.cobj(c).tags + " " + JP.cobj(c).en).join(" "));
      let s = 0, hit = 0;
      toks.forEach(t => { let h = 0; if (title.includes(t)) h = 5; else if (hay.includes(t)) h = 3; else if (ctags.includes(t)) h = 2; if (h) { hit++; s += h; } });
      if (hit >= Math.ceil(toks.length / 2)) res.push({ o, s: s + ({ guide: 3, office: 2, req: 1 }[o.type] || 0) });
    });
    return res.sort((a, b) => b.s - a.s).map(r => r.o);
  };
  JP.suggestCases = q => { const toks = JP.tokens(q || ""); if (!toks.length) return []; return JP.CASES.filter(c => { const h = norm(c.tags + " " + c.en + " " + c.fil); return toks.some(t => h.includes(t)); }); };

  /* ---------- router ---------- */
  JP.go = function (name, params, opt) {
    const S = JP.S; if (!(opt && opt.replace)) S.stack.push(S.route);
    S.route = { name, params: params || {} }; S.sheet = null; JP._scroll0 = true; JP.render();
  };
  JP.back = function () { const S = JP.S; S.route = S.stack.pop() || { name: "home", params: {} }; S.sheet = null; JP._scroll0 = true; JP.render(); };
  JP.tab = function (name) { JP.S.stack = []; JP.S.route = { name, params: {} }; JP.S.sheet = null; JP._scroll0 = true; JP.render(); };
  JP.TABS = ["home", "assistant", "nearby", "library", "profile"];
  JP.rootOf = n => ({ home: "home", assistant: "assistant", case: "home", list: "home", rl: "home", nearby: "nearby", library: "library", item: "library", messages: "home", chat: "home", notifs: "home", profile: "profile", settings: "profile", dpa: "profile", about: "profile" }[n] || "home");

  /* ---------- shell render ---------- */
  JP.render = function () {
    const S = JP.S, root = document.getElementById("app"), prev = root.querySelector("main");
    const keep = prev && !JP._scroll0 ? prev.scrollTop : 0; JP._scroll0 = false;
    const set = JP.D.set, de = document.documentElement;
    de.dataset.size = set.size; de.dataset.hc = set.hc ? "1" : "0"; de.lang = set.lang === "fil" ? "fil" : "en";
    if (set.theme === "system") de.removeAttribute("data-theme"); else de.dataset.theme = set.theme;
    if (S.neutral) { root.innerHTML = JP.neutralHTML(); return; }
    if (S.gate) { root.innerHTML = JP.gateHTML() + (S.toast ? '<div class="toast" role="status">' + JP.esc(S.toast) + "</div>" : ""); if (JP.onRender) JP.onRender(null); return; }
    if (JP.loadTawk) JP.loadTawk();
    const v = JP.V[S.route.name] ? JP.V[S.route.name](S.route.params) : { title: "", body: "" };
    const isRoot = JP.TABS.includes(S.route.name) && S.route.name !== "help";
    const exit = set.quickExit ? '<button class="tbtn exitbtn" data-act="exit" aria-label="' + JP.t("Quick exit") + '">' + JP.ic("exit", "sm") + JP.t("Quick exit") + "</button>" : "";
    const left = isRoot
      ? '<div class="brand-wrap"><div class="brand"><svg class="mark" aria-hidden="true"><use href="#i-logo"/></svg>JustiPath</div>' + (S.route.name === "home" ? '<div class="tagline">' + JP.t("Know your rights. Find your way. Take the next step.") + "</div>" : "") + "</div>"
      : '<button class="tbtn" data-act="back" aria-label="' + JP.t("Back") + '">' + JP.ic("back") + '</button><h1>' + JP.esc(v.title || "") + "</h1>";
    const unr0 = JP.NOTIFS.filter(n => !JP.D.readN.includes(n.id)).length;
    const homeIcons = '<button class="tbtn sm" data-act="go" data-to="chat" aria-label="' + JP.t("Live chat") + '">' + JP.ic("message") + '</button><button class="tbtn sm" data-act="go" data-to="notifs" aria-label="' + JP.t("Notifications") + '">' + JP.ic("bell") + (unr0 ? '<span class="bdot">' + unr0 + "</span>" : "") + "</button>";
    const gear = isRoot && S.route.name === "home" ? homeIcons : isRoot && S.route.name === "profile" ? '<button class="tbtn" data-act="go" data-to="settings" aria-label="' + JP.t("Settings") + '">' + JP.ic("settings") + "</button>" : "";
    const unread = JP.NOTIFS.filter(n => !JP.D.readN.includes(n.id)).length;
    const nav = [["home", "Home", "home"], ["assistant", "Assistant", "spark"], ["nearby", "Nearby", "pin"], ["library", "Library", "book"], ["profile", "Profile", "user"]]
      .map(([k, l, i]) => '<button data-act="tab" data-to="' + k + '"' + (k === JP.rootOf(S.route.name) ? ' aria-current="page"' : "") + ">" + JP.ic(i) + "<span>" + JP.t(l) + "</span>" + "" + "</button>").join("");
    root.innerHTML = '<header class="topbar">' + left + gear + exit + '</header><main id="main"' + (v.mainClass ? ' class="' + v.mainClass + '"' : "") + ">" + v.body + "</main>" + (v.composer || "") + (v.noNav ? "" : '<nav class="nav" aria-label="Main">' + nav + "</nav>") + JP.overlayHTML() + (S.toast ? '<div class="toast" role="status">' + JP.esc(S.toast) + "</div>" : "");
    const m = document.getElementById("main"); if (m) m.scrollTop = keep;
    if (v.after) v.after();
    if (JP.onRender) JP.onRender(v);
  };

  /* ---------- delegated events ---------- */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = JP.A[el.dataset.act]; if (a) { if (el.tagName === "A" && !el.dataset.native) e.preventDefault(); a(el, e); }
  });
  document.addEventListener("input", e => { const el = e.target.closest("[data-in]"); if (el && JP.I[el.dataset.in]) JP.I[el.dataset.in](el, e); });
  document.addEventListener("submit", e => { const f = e.target.closest("form[data-submit]"); if (f) { e.preventDefault(); JP.A[f.dataset.submit](f, e); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (JP.S.sheet) { JP.S.sheet = null; JP.render(); } } });

  JP.A.back = () => JP.back();
  JP.A.tab = el => { const to = el.dataset.to; if (to === "help") { JP.S.sheet = { k: "help", c: null }; JP.render(); } else JP.tab(to); };
  JP.A.go = el => JP.go(el.dataset.to, el.dataset.id ? { id: el.dataset.id, c: el.dataset.c, tab: el.dataset.tab, type: el.dataset.type } : {});
  JP.A.item = el => JP.go("item", { id: el.dataset.id });
  JP.A.case = el => JP.go("case", { id: el.dataset.id, tab: el.dataset.tab || "guide" });
  JP.A.list = el => JP.go("list", { type: el.dataset.type, c: el.dataset.c || "" });
  JP.A.closeSheet = (el, e) => { if (el.classList.contains("sheet-bg") && e && e.target !== el) return; JP.S.sheet = null; JP.render(); };
  JP.A.exit = () => { JP.S.neutral = true; JP.S.sheet = null; JP.render(); };
  JP.A.unexit = () => { JP.S.neutral = false; JP.render(); };
  JP.A.copy = el => {
    const txt = el.dataset.txt, done = () => JP.toast(JP.t("Copied") + ": " + txt);
    try { navigator.clipboard.writeText(txt).then(done, done); } catch (er) { done(); }
  };
})();

</script>
<script>
/* JustiPath views, part 1: home, case, lists, library, item detail. */
(function () {
  const JP = window.JP, esc = JP.esc, ic = JP.ic, t = JP.t;
  const tel = n => "tel:" + (n.match(/^[+\d()\s-]+/) || [n])[0].replace(/[^\d+]/g, "");
  const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q + " near me");
  JP.tel = tel; JP.mapUrl = mapUrl;

  const iboxCls = o => o.cases.length === 1 ? o.cases[0] : "";
  const caseBadges = o => o.cases.map(c => '<span class="badge ' + c + '">' + esc(JP.cname(c).split(" /")[0]) + "</span>").join("");
  JP.statusBadge = h => { const s = JP.status(h); return '<span class="badge ' + (s.open ? "open" : "closed") + '">' + ic(s.open ? "check" : "clock", "sm") + esc(s.label) + "</span>"; };
  JP.verBadge = v => v === "src" ? '<span class="badge ok">' + ic("check", "sm") + t("Source-checked") + ": ehotlines.e.gov.ph, " + JP.CHECKED + "</span>" : '<span class="badge warn">' + ic("alert", "sm") + t("Please verify before use") + "</span>";

  JP.rowHTML = function (o, showType) {
    const ty = JP.TYPES[o.type];
    let side = "";
    if (o.type === "office") side = JP.statusBadge(o.hours);
    if (o.type === "hotline") side = '<span class="num" style="font-size:1rem">' + esc(o.num) + "</span>";
    const sub = o.type === "office" ? o.handles : o.type === "hotline" ? o.when : o.type === "law" ? o.num + ". " + o.sum : o.sum || "";
    return '<button class="row" data-act="item" data-id="' + o.id + '"><span class="ibox ' + iboxCls(o) + '">' + ic(ty.icon) + '</span><span class="grow"><span class="t">' + esc(o.title) + '</span><br><span class="s">' + esc(sub) + '</span><span class="bar" style="margin-top:4px">' + (showType ? '<span class="badge">' + t(ty.one) + "</span>" : "") + caseBadges(o) + side + "</span></span>" + ic("chev", "sm chev") + "</button>";
  };

  /* ---------- HOME ---------- */
  JP.V.home = function () {
    const u = JP.D.session ? JP.D.users[JP.D.session] : null, name = u ? u.name.split(" ")[0] : null;
    const chips = JP.CASES.map(c => '<button class="bchip ' + c.id + '" data-act="case" data-id="' + c.id + '">' + ic(c.icon) + esc(c[JP.lang()].split(" /")[0]) + "</button>").join("");
    const sos = !!JP.S.sos, who = esc(name || t("there"));
    const msg = sos
      ? '<button class="msgbtn" data-act="bubble" aria-live="polite"><b>' + t("Need Immediate Help? Call 911") + '</b><small>' + t("Tap here to go back") + "</small></button>" +
        '<a class="btn red block" href="tel:911" data-native="1" aria-label="' + t("Call 911 now") + '">' + ic("phone", "sm") + t("Call 911 now") + '</a><p class="lede" style="font-size:.74rem">' + t("Your phone will open its dialer with 911 ready. Press the green call button if it does not dial by itself.") + "</p>"
      : '<button class="msgbtn" data-act="bubble" aria-live="polite"><b>' + t("Hello") + ", " + who + "!</b> " + t("How can I help you?") + '<small>' + t("Tap this message for emergency help") + "</small></button>";
    const M = [
      ["rl", "scale", "Rights | Laws", "Know your rights and the laws behind them", "go", ""],
      ["office", "building", "Institutions", "Who to go to, with open or closed hours", "list", ""],
      ["guide", "route", "Reporting Instructions", "Step by step, from incident to filing", "list", ""],
      ["help", "phone", "Hotlines", "911 and hotlines for your case", "tab", "em"],
      ["chat", "headset", "Support", "Chat with us about using the app", "go", ""],
      ["settings", "settings", "Settings", "Language, text size, privacy", "go", ""]
    ].map(([k, i, l, sub, act, cls]) => '<button class="mrow ' + cls + '" data-act="' + act + '" ' + (act === "list" ? 'data-type="' + k + '"' : 'data-to="' + k + '"') + '><span class="mi">' + ic(i) + '</span><span class="mt">' + t(l) + '<span class="ms">' + t(sub) + "</span></span>" + ic("chev", "sm chev") + "</button>").join("");
    return { title: "Home", body:
      '<section class="guide"><button class="mascot" data-act="pickGuide" aria-label="' + t("Choose your guide") + '">' + JP.avatar(JP.curChar(), sos ? "sos" : "greet") + '<span>' + esc(JP.curChar().short) + '</span><em>' + t("Tap to change") + '</em></button><div class="bubble rd' + (sos ? " sos" : "") + '">' + msg + JP.spk(t("Read aloud"), "abs") + '<div class="bchips" role="group" aria-label="' + t("What happened?") + '">' + chips + "</div></div></section>" +
      '<nav class="menu" aria-label="' + t("Browse by section") + '">' + M + "</nav>" +
      '<div class="note info">' + ic("info", "sm") + "<span>" + t("JustiPath gives general information only. It is not legal advice, and it does not file cases for you.") + "</span></div>" +
      '<form class="bsearch" data-submit="homeSearch" role="search"><div class="search">' + ic("search") + '<input id="hq" type="search" placeholder="' + esc(t("Search: boss won’t pay me, na-hack ang account")) + '" aria-label="' + t("Search") + '" autocomplete="off"><button class="go" type="submit" aria-label="' + t("Search") + '">' + ic("chev", "sm") + "</button></div></form>" };
  };

  /* ---------- RIGHTS | LAWS (combined list) ---------- */
  JP.V.rl = function (p) {
    const ty = p.type || "right", c = p.c || "";
    const seg = '<div class="seg"><button data-act="rlTab" data-type="right" data-c="' + c + '" aria-pressed="' + (ty === "right") + '">' + t("Rights") + '</button><button data-act="rlTab" data-type="law" data-c="' + c + '" aria-pressed="' + (ty === "law") + '">' + t("Laws") + "</button></div>";
    const chips = '<div class="chips"><button class="chip" aria-pressed="' + !c + '" data-act="rlTab" data-type="' + ty + '" data-c="">' + t("All") + "</button>" + JP.CASES.map(x => '<button class="chip" aria-pressed="' + (c === x.id) + '" data-act="rlTab" data-type="' + ty + '" data-c="' + x.id + '">' + esc(x[JP.lang()].split(" /")[0]) + "</button>").join("") + "</div>";
    const items = JP.ofType(ty, c);
    return { title: t("Rights") + " | " + t("Laws"), body: seg + chips + '<div class="card pad0">' + (items.length ? items.map(o => JP.rowHTML(o)).join("") : '<p class="empty">' + t("Nothing here yet.") + "</p>") + "</div>" };
  };
  JP.A.rlTab = el => { JP.S.route = { name: "rl", params: { type: el.dataset.type, c: el.dataset.c } }; JP.render(); };

  /* ---------- NEARBY (offices open now, with map) ---------- */
  JP.nb = JP.nb || { c: "" };
  JP.V.nearby = function () {
    const c = JP.nb.c;
    const chips = '<div class="chips"><button class="chip" aria-pressed="' + !c + '" data-act="nbCase" data-c="">' + t("All cases") + "</button>" + JP.CASES.map(x => '<button class="chip" aria-pressed="' + (c === x.id) + '" data-act="nbCase" data-c="' + x.id + '">' + esc(x[JP.lang()].split(" /")[0]) + "</button>").join("") + "</div>";
    const items = JP.OFFICES.filter(o => !c || o.cases.includes(c)).sort((a, b) => JP.status(b.hours).open - JP.status(a.hours).open);
    const rows = items.map(o => '<div class="mini"><span class="ibox ' + iboxCls(o) + '">' + ic("building") + '</span><span class="grow" style="flex:1;min-width:0"><button class="linkbtn" data-act="item" data-id="' + o.id + '" style="text-align:left;color:var(--ink);font-weight:700;padding:0">' + esc(o.title) + "</button><br>" + JP.statusBadge(o.hours) + '</span><a class="btn sec sm" href="' + mapUrl(o.q) + '" target="_blank" rel="noopener" aria-label="' + t("Map") + " " + esc(o.title) + '">' + ic("pin", "sm") + t("Map") + "</a></div>").join("");
    return { title: "Nearby", body: '<h2 class="h2">' + t("Nearby") + '</h2><p class="lede">' + t("Tap Map to search near your current location. Hours may vary, so call before you go.") + "</p>" + chips + '<div class="card pad0">' + rows + '</div><div class="note">' + ic("info", "sm") + "<span>" + t("Open or closed is shown in Philippine time.") + "</span></div>" };
  };
  JP.A.nbCase = el => { JP.nb.c = el.dataset.c; JP.render(); };
  JP.A.bubble = () => { JP.S.sos = !JP.S.sos; JP.render(); };
  JP.A.homeSearch = f => { const q = f.querySelector("input").value.trim(); JP.lib = { q, type: "", c: "" }; if (q && JP.D.set.saveSearch) { JP.D.recent = [q].concat(JP.D.recent.filter(x => x !== q)).slice(0, 5); JP.save(); } JP.go("library"); };

  /* ---------- CASE ---------- */
  const CTABS = [["guide", "Guide"], ["checklist", "Checklist"], ["right", "Rights"], ["law", "Laws"], ["office", "Institutions"], ["hotline", "Hotlines"], ["link", "Links"]];
  JP.stepsHTML = g => '<ol class="steps">' + g.steps.map((s, i) => '<li class="step rd">' + JP.spk(t("Read aloud"), "abs") + '<span class="n">' + (i + 1) + '</span><div><h3 class="h3">' + esc(s.t) + '</h3><p class="lede">' + esc(s.d) + '</p><p class="x"><b>' + t("What to expect") + ":</b> " + esc(s.x) + "</p></div></li>").join("") + "</ol>";
  JP.checklistHTML = function (q) {
    const done = JP.D.checks[q.id] || [], pct = Math.round(done.length / q.items.length * 100);
    return '<div class="card"><div class="sec-h"><span class="h3">' + done.length + " / " + q.items.length + " " + t("ready") + '</span><span class="lede">' + pct + '%</span></div><div class="progress" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div></div><div class="card pad0">' +
      q.items.map((x, i) => '<button class="check" role="checkbox" aria-checked="' + done.includes(i) + '" data-act="tick" data-id="' + q.id + '" data-i="' + i + '"><span class="box">' + (done.includes(i) ? ic("check", "sm") : "") + '</span><span class="lbl">' + esc(x) + "</span></button>").join("") + "</div>";
  };
  JP.A.tick = el => { const id = el.dataset.id, i = +el.dataset.i, a = JP.D.checks[id] || (JP.D.checks[id] = []); const k = a.indexOf(i); if (k >= 0) a.splice(k, 1); else a.push(i); JP.save(); JP.render(); };

  JP.V.case = function (p) {

      '<button class="sosbtn" data-act="helpCase" data-c="' + c.id + '" style="padding:10px 14px">' + ic("alert") + "<span style=\"font-size:1rem\">" + t("Need help now?") + "</span></button>" + tabs + body +
      '<button class="btn sec block" data-act="libCase" data-c="' + c.id + '">' + ic("book", "sm") + t("Open everything for this case in the Library") + "</button>" };

  JP.A.caseTab = el => { JP.S.route = { name: "case", params: { id: el.dataset.id, tab: el.dataset.tab } }; JP.render(); };
  JP.A.libCase = el => { JP.lib = { q: "", type: "", c: el.dataset.c }; JP.go("library"); };

  /* ---------- LIST (one category only) ---------- */

  };
  JP.A.listCase = el => { JP.S.route = { name: "list", params: { type: el.dataset.type, c: el.dataset.c, cat: (JP.S.route.params || {}).cat || "" } }; JP.render(); };
  JP.A.listCat = el => { JP.S.route = { name: "list", params: { type: "hotline", c: el.dataset.c || "", cat: el.dataset.cat } }; JP.render(); };

  /* ---------- LIBRARY (everything, with search) ---------- */
  JP.lib = JP.lib || { q: "", type: "", c: "" };
  function libResults() {
    const L = JP.lib, items = JP.search(L.q, { type: L.type, c: L.c });
    const sug = L.q ? JP.suggestCases(L.q) : [];

    return sh + '<p class="lede" id="count">' + items.length + " " + t("results") + "</p>" + '<div class="card pad0">' + (items.length ? items.map(o => JP.rowHTML(o, true)).join("") : '<p class="empty">' + t("No results. Try other words, like sahod, pulis, or hotline.") + "</p>") + "</div>";
  }
  JP.V.library = function () {
    const L = JP.lib;
    const tchips = '<div class="chips"><button class="chip" aria-pressed="' + !L.type + '" data-act="libType" data-type="">' + t("All") + "</button>" + Object.keys(JP.TYPES).map(k => '<button class="chip" aria-pressed="' + (L.type === k) + '" data-act="libType" data-type="' + k + '">' + ic(JP.TYPES[k].icon, "sm") + t(JP.TYPES[k].label) + "</button>").join("") + "</div>";
    const cchips = '<div class="chips"><button class="chip" aria-pressed="' + !L.c + '" data-act="libC" data-c="">' + t("All cases") + "</button>" + JP.CASES.map(x => '<button class="chip" aria-pressed="' + (L.c === x.id) + '" data-act="libC" data-c="' + x.id + '">' + esc(x[JP.lang()].split(" /")[0]) + "</button>").join("") + "</div>";

    return { title: "Library", body: '<h2 class="h2">' + t("Library") + '</h2><p class="lede">' + t("Every right, law, institution, hotline, checklist, guide, and link in one place.") + '</p><div class="search">' + ic("search") + '<input id="lq" type="search" data-in="lib" value="' + esc(L.q) + '" placeholder="' + esc(t("Search rights, laws, offices, hotlines")) + '" aria-label="' + t("Search") + '" autocomplete="off"></div>' + recent + tchips + cchips + '<div id="results" style="display:flex;flex-direction:column;gap:12px">' + libResults() + "</div>" };
  };
  JP.I.lib = el => { JP.lib.q = el.value; document.getElementById("results").innerHTML = libResults(); };
  JP.A.libType = el => { JP.lib.type = el.dataset.type; JP.render(); };
  JP.A.libC = el => { JP.lib.c = el.dataset.c; JP.render(); };
  JP.A.libQ = el => { JP.lib.q = el.dataset.q; JP.render(); };

  /* ---------- ITEM DETAIL ---------- */
  JP.V.item = function (p) {
    const o = JP.BY[p.id]; if (!o) return { title: "", body: "" }; const ty = JP.TYPES[o.type];
    const saved = JP.D.saved.includes(o.id);
    let b = "";
    if (o.type === "law") b = '<p class="lede">' + esc(o.num) + "</p><p>" + esc(o.sum) + '</p><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">' + o.pts.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
    if (o.type === "right") b = "<p>" + esc(o.sum) + '</p><p class="lede">' + t("Based on") + ": " + esc(o.law) + "</p>";
    if (o.type === "office") b = "<p>" + esc(o.sum) + '</p><dl class="kv"><dt>' + t("Address") + "</dt><dd>" + esc(o.addr) + "</dd><dt>" + t("Hours") + "</dt><dd>" + esc(JP.hoursText(o.hours)) + "<br>" + JP.statusBadge(o.hours) + "</dd><dt>" + t("Handles") + "</dt><dd>" + esc(o.handles) + "</dd><dt>" + t("Note") + "</dt><dd>" + esc(o.note) + '</dd></dl><div class="bar"><a class="btn" href="' + mapUrl(o.q) + '" target="_blank" rel="noopener">' + ic("pin", "sm") + t("Map") + "</a></div>";
    if (o.type === "hotline") b = '<div class="numrow" style="border:0;padding:0"><span class="num" style="font-size:1.8rem">' + esc(o.num) + "</span></div>" + (o.alt ? '<p class="lede">' + t("Also") + ": <span class=\"num\" style=\"font-size:1rem\">" + esc(o.alt) + "</span></p>" : "") + "<p><b>" + t("When to use") + ":</b> " + esc(o.when) + "</p>" + JP.verBadge(o.v) + '<div class="bar"><a class="btn red" href="' + tel(o.num) + '">' + ic("phone", "sm") + t("Call") + '</a><button class="btn sec" data-act="copy" data-txt="' + esc(o.num) + '">' + ic("copy", "sm") + t("Copy number") + '</button></div><p class="lede">' + t("If Call does nothing, dial the number on your phone.") + "</p>";
    if (o.type === "req") b = "<p>" + esc(o.sum) + "</p>" + JP.checklistHTML(o);
    if (o.type === "guide") b = "<p>" + esc(o.sum) + "</p>" + JP.stepsHTML(o);
    if (o.type === "link") b = "<p>" + esc(o.sum) + '</p><dl class="kv"><dt>' + t("Website") + "</dt><dd>" + esc(o.url) + "</dd>" + (o.email ? "<dt>" + t("Email") + "</dt><dd>" + esc(o.email) + "</dd>" : "") + "</dl>" + JP.verBadge("chk") + '<div class="bar"><a class="btn" href="' + esc(o.url) + '" target="_blank" rel="noopener">' + ic("external", "sm") + t("Open official site") + "</a>" + (o.email ? '<button class="btn sec" data-act="copy" data-txt="' + esc(o.email) + '">' + ic("copy", "sm") + t("Copy email") + "</button>" : "") + "</div>";
    const rel = JP.related(o);
    const relHTML = rel.length ? '<div class="sec-h"><h2 class="h2">' + t("Linked to this") + '</h2></div><div class="card pad0">' + rel.map(x => JP.rowHTML(x, true)).join("") + "</div>" : "";
    return { title: t(ty.one), body:
      '<section class="card rd">' + JP.spk(t("Read aloud"), "abs") + '<div style="display:flex;gap:12px;align-items:flex-start"><span class="ibox ' + iboxCls(o) + '">' + ic(ty.icon) + '</span><div style="min-width:0"><h2 class="h2">' + esc(o.title) + '</h2><div class="bar" style="margin-top:6px"><span class="badge">' + t(ty.one) + "</span>" + caseBadges(o) + "</div></div></div>" + b +
      '<div class="bar"><button class="btn sec sm" data-act="save" data-id="' + o.id + '" aria-pressed="' + saved + '">' + ic("bookmark", "sm") + (saved ? t("Saved") : t("Save")) + "</button></div></section>" + relHTML +
      '<div class="note">' + ic("info", "sm") + "<span>" + t("General information only. Confirm details with the office before you go.") + "</span></div>" };
  };
  JP.A.save = el => { const id = el.dataset.id, a = JP.D.saved, i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else a.push(id); JP.save(); JP.render(); JP.toast(i >= 0 ? t("Removed from saved") : t("Saved to your profile")); };
})();

</script>
<script>
/* JustiPath views, part 2: help sheet, gate (privacy consent, log in), messages, chat, profile, settings. */
(function () {
  const JP = window.JP, esc = JP.esc, ic = JP.ic, t = JP.t, S = JP.S;
  JP.REGIONS = ["NCR (Metro Manila)", "CAR (Cordillera)", "Region I (Ilocos)", "Region II (Cagayan Valley)", "Region III (Central Luzon)", "Region IV-A (CALABARZON)", "MIMAROPA", "Region V (Bicol)", "Region VI (Western Visayas)", "Region VII (Central Visayas)", "Region VIII (Eastern Visayas)", "Region IX (Zamboanga Peninsula)", "Region X (Northern Mindanao)", "Region XI (Davao)", "Region XII (SOCCSKSARGEN)", "Region XIII (Caraga)", "BARMM"];
  const hashFb = (email, pw) => btoa(unescape(encodeURIComponent(email + pw)));
  const hash = async (email, pw) => { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("jp:" + email + ":" + pw)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join(""); } catch (e) { return btoa(unescape(encodeURIComponent(email + pw))); } };
  const field = (id, label, type, val, extra) => '<div class="field"><label for="' + id + '">' + t(label) + '</label><input id="' + id + '" name="' + id + '" type="' + type + '" value="' + esc(val || "") + '" ' + (extra || "") + "></div>";
  const regionSel = v => '<div class="field"><label for="region">' + t("Region") + '</label><select id="region" name="region">' + JP.REGIONS.map(r => '<option' + (r === v ? " selected" : "") + ">" + esc(r) + "</option>").join("") + "</select></div>";

  /* ---------- overlays: help sheet and confirm ---------- */
  JP.overlayHTML = function () {
    const sh = S.sheet; if (!sh) return "";
    if (sh.k === "confirm") return '<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><h2 class="h2">' + esc(sh.title) + '</h2><p class="lede">' + esc(sh.msg) + '</p><div class="bar"><button class="btn red" data-act="doConfirm">' + esc(sh.label) + '</button><button class="btn sec" data-act="closeSheet">' + t("Cancel") + "</button></div></div></div>";
    const c = sh.c || "", list = JP.HOTLINES.filter(h => (!c || h.cases.includes(c)) && h.id !== "h-911").sort((a, b) => b.em - a.em);
    const chips = '<div class="chips"><button class="chip" aria-pressed="' + !c + '" data-act="helpCase" data-c="">' + t("All") + "</button>" + JP.CASES.map(x => '<button class="chip" aria-pressed="' + (c === x.id) + '" data-act="helpCase" data-c="' + x.id + '">' + esc(x[JP.lang()].split(" /")[0]) + "</button>").join("") + "</div>";
    const h911 = JP.BY["h-911"];
    return '<div class="sheet-bg" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + t("Need help now?") + '"><div class="grab"></div><div class="sec-h"><h2 class="h2">' + t("Need help now?") + '</h2><button class="tbtn" style="background:var(--surface-2);color:var(--ink)" data-act="closeSheet" aria-label="' + t("Close") + '">' + ic("x") + '</button></div>' +
      '<div class="card" style="background:var(--red-soft);border-color:var(--red)"><span class="badge closed">' + ic("alert", "sm") + t("In danger? Call first") + '</span><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="num" style="font-size:2.4rem">911</span><span class="lede" style="flex:1;min-width:140px">' + t("National Emergency Hotline") + '</span></div><div class="bar"><a class="btn red" href="tel:911">' + ic("phone", "sm") + t("Call") + ' 911</a><button class="btn sec" data-act="copy" data-txt="911">' + ic("copy", "sm") + t("Copy number") + '</button></div></div>' +
      '<p class="lede">' + t("Pick your case to see the hotlines that fit. If Call does nothing, dial the number on your phone.") + "</p>" + chips +
      '<div class="card pad0">' + list.map(h => '<div class="numrow"><span class="ibox">' + ic("phone") + '</span><div style="flex:1;min-width:0"><div class="t" style="font-weight:700">' + esc(h.title) + '</div><div class="lede" style="font-size:.78rem">' + esc(h.when) + '</div><span class="num" style="font-size:1.1rem">' + esc(h.num) + "</span></div>" + '<a class="btn sm" href="' + JP.tel(h.num) + '" aria-label="' + t("Call") + " " + esc(h.title) + '">' + ic("phone", "sm") + '</a><button class="btn sec sm" data-act="copy" data-txt="' + esc(h.num) + '" aria-label="' + t("Copy number") + '">' + ic("copy", "sm") + "</button></div>").join("") + "</div>" +
      '<button class="btn sec block" data-act="list" data-type="hotline">' + t("See all hotlines") + "</button></div></div>";
  };
  JP.A.doConfirm = () => { const a = S.sheet && S.sheet.act; S.sheet = null; if (a && JP.A[a]) JP.A[a](); };
  const confirm = (title, msg, label, act) => { S.sheet = { k: "confirm", title, msg, label, act }; JP.render(); };

  /* ---------- neutral screen for quick exit ---------- */
  JP.neutralHTML = () => '<div class="weather"><p>Manila</p><div class="big">31°</div><p>Partly cloudy</p><p style="opacity:.8">H 33°  L 26°</p><div style="flex:1"></div><button class="linkbtn" style="color:#0b2a4a;opacity:.55;font-size:.8rem" data-act="unexit">Back</button></div>';

  /* ---------- gate: consent then log in ---------- */
  const NOTICE = [
    ["Who we are", "JustiPath is a Philippine student prototype that guides people to rights, laws, institutions, and hotlines. This notice follows the Data Privacy Act of 2012 (Republic Act No. 10173)."],
    ["What we collect", "Only what you type: your name, email, mobile number, region, and an optional emergency contact. Your checklist ticks, saved items, settings, and chat messages are also kept. We do not ask for case details."],
    ["Why we collect it", "To let you log in, personalize the app, and let our support team answer app questions. We do not use your data for advertising and we do not sell it."],
    ["Where it is kept", "In this prototype your data stays on your own device. Clearing your data in Settings removes it."],
    ["Your rights", "You may be informed, access and correct your data, object to its use, ask for its erasure or blocking, claim damages, and move your data. You may file a complaint with the National Privacy Commission (privacy.gov.ph)."],
    ["Live chat", "If live chat with a support agent is turned on, your messages and the name and email on your account are handled by a third-party chat provider (Tawk.to) so the agent can reply. Do not send case details."],
    ["Sensitive details", "Please do not type case details, names of victims, or private documents into the live chat. Use the quick exit button if someone may see your screen."]
  ];
JP.creditHTML = () => '<p class="lede" style="text-align:center;font-size:.8rem">' + t("Created by") + " <b>" + esc(JP.OWNER.real) + "</b> (" + esc(JP.OWNER.alias) + ") · © " + JP.OWNER.year + "</p>";
  JP.noticeHTML = () => NOTICE.map(([h, p]) => "<div><h4>" + t(h) + "</h4><p>" + t(p) + "</p></div>").join("");
  JP.gateHTML = function () {
    const logo = '<div class="logo"><svg aria-hidden="true"><use href="#i-logo"/></svg>JustiPath</div><div class="flag"></div>';
    const lang = '<div class="seg" style="max-width:200px"><button data-act="setSet" data-k="lang" data-v="en" aria-pressed="' + (JP.lang() === "en") + '">English</button><button data-act="setSet" data-k="lang" data-v="fil" aria-pressed="' + (JP.lang() === "fil") + '">Filipino</button></div>';
    if (S.gate === "consent") return '<div class="full"><div class="cover">' + logo + lang + "<h1 style=\"font-size:1.5rem\">" + t("Data Privacy Act notice") + '</h1><p class="lede">' + t("Please read this before using JustiPath.") + '</p><div class="card dpa" tabindex="0">' + JP.noticeHTML() + '</div><button class="check card" role="checkbox" aria-checked="' + !!S.agree + '" data-act="agree" style="border:1px solid var(--line);border-radius:14px"><span class="box">' + (S.agree ? ic("check", "sm") : "") + "</span><span class=\"lbl\" style=\"text-decoration:none;color:var(--ink)\">" + t("I have read the notice and I agree to the processing of my information under the Data Privacy Act (RA 10173).") + '</span></button><button class="btn block" data-act="consent" ' + (S.agree ? "" : "disabled") + ">" + t("Agree and continue") + '</button><button class="btn sec block" data-act="decline">' + t("Decline") + "</button>" + JP.creditHTML() + "</div></div>";
    const reg = S.authMode === "register", e = S.err ? '<p class="err" role="alert" style="color:var(--red);font-size:.85rem">' + esc(S.err) + "</p>" : "";
    return '<div class="full"><div class="cover">' + logo + lang + "<h1 style=\"font-size:1.5rem\">" + (reg ? t("Create your account") : t("Log in")) + "</h1>" +
      '<div class="seg"><button data-act="authMode" data-v="login" aria-pressed="' + !reg + '">' + t("Log in") + '</button><button data-act="authMode" data-v="register" aria-pressed="' + reg + '">' + t("Create account") + "</button></div>" +
      '<form data-submit="auth" style="display:flex;flex-direction:column;gap:12px" novalidate>' + (reg ? field("name", "Full name", "text", "", 'autocomplete="name"') : "") + field("email", "Email account", "email", reg ? "" : (JP.D.lastEmail || ""), 'autocomplete="email" inputmode="email"') + (reg ? field("mobile", "Mobile number (09XX XXX XXXX or +63)", "tel", "", 'autocomplete="tel" inputmode="tel"') + regionSel("") : "") + field("pw", "Password", "password", "", 'autocomplete="' + (reg ? "new-password" : "current-password") + '"') + (reg ? field("pw2", "Confirm password", "password", "", 'autocomplete="new-password"') : "") + e + '<button class="btn block" type="submit">' + (reg ? t("Create account") : t("Log in")) + "</button></form>" +
      '<button class="btn sec block" data-act="guest">' + t("Continue without an account") + '</button><p class="lede">' + t("Your account is saved on this device. Next time, log in with the same email and password.") + "</p>" + JP.creditHTML() + "</div></div>";
  };
  JP.A.agree = () => { S.agree = !S.agree; JP.render(); };
  JP.A.decline = () => JP.toast(t("You need to agree to the Data Privacy Act notice to use JustiPath."));
  JP.A.consent = () => { if (!S.agree) return; JP.D.consent = { ts: new Date().toISOString(), v: 1 }; JP.save(); S.gate = (JP.D.session || JP.D.guest) ? null : "auth"; JP.render(); };
  JP.A.authMode = el => { S.authMode = el.dataset.v; S.err = ""; JP.render(); };
  JP.A.guest = () => { JP.D.guest = true; JP.save(); S.gate = null; S.err = ""; JP.render(); };
  JP.A.auth = async f => {
    const v = n => (f.elements[n] ? f.elements[n].value.trim() : ""), email = v("email").toLowerCase(), pw = f.elements.pw.value;
    const fail = m => { S.err = m; JP.render(); };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail(t("Enter a valid email address."));
    if (S.authMode === "register") {
      const mobile = v("mobile").replace(/[\s-]/g, "");
      if (v("name").length < 2) return fail(t("Enter your full name."));
      if (!/^(09|\+639)\d{9}$/.test(mobile)) return fail(t("Enter a Philippine mobile number, like 0917 123 4567."));
      if (pw.length < 8) return fail(t("Use at least 8 characters for your password."));

  const textOf = el => { const c = el.cloneNode(true); c.querySelectorAll(".spk,.rbar,.reacts,.vfab,script,style,svg").forEach(n => n.remove()); const d = document.createElement("div"); d.innerHTML = c.innerHTML.replace(/<[^>]+>/g, " "); return (d.textContent || "").replace(/\s+/g, " ").trim(); };
  JP.A.speakEl = el => { const host = el.closest(".rd") || el.parentElement; JP.speak(textOf(host)); };
  JP.A.readScreen = () => {
    if (JP._speaking && speechSynthesis.speaking) { JP.stopSpeak(); return; }
    const m = document.getElementById("main"), h = document.querySelector(".topbar h1"); if (!m) return;
    JP.speak(((h ? h.textContent + ". " : "") + textOf(m)).slice(0, 4000));
  };
  JP.A.voiceOn = () => { JP.D.set.voice = true; JP.save(); JP.render(); JP.speak(t("Voice support is on. Tap any button to hear it. Tap the speaker icon to hear information.")); };
  JP.A.testVoice = () => JP.speak(t("Voice support is working. JustiPath can read buttons and information aloud."));
  JP.spk = (label, cls) => '<button class="spk ' + (cls || "") + '" data-act="speakEl" aria-label="' + esc(label || t("Read aloud")) + '" title="' + esc(label || t("Read aloud")) + '">' + ic("speaker", "sm") + "</button>";

  /* announce what the user taps (voice mode) */
  document.addEventListener("click", e => {
    if (!JP.D || !JP.D.set.voice) return;
    const el = e.target.closest("button,a,[role=checkbox],[role=switch],[role=button],[data-act]");
    if (!el || el.closest(".vfab,.spkfloat,.spk")) return;
    let label = el.getAttribute("aria-label") || textOf(el); if (!label) return;
    if (el.getAttribute("role") === "switch") label += ", " + (el.getAttribute("aria-checked") === "true" ? t("now off") : t("now on"));
    if (el.getAttribute("role") === "checkbox") label += ", " + (el.getAttribute("aria-checked") === "true" ? t("unchecked") : t("checked"));
    JP.speak(label.slice(0, 160));
  }, true);
  /* read the selected text with the floating speaker */
  const fab = document.createElement("button"); fab.className = "spkfloat"; fab.hidden = true; fab.setAttribute("aria-label", "Read selected text aloud"); fab.innerHTML = ic("speaker"); document.body.appendChild(fab);
  let selTxt = "", selTm;
  const upd = () => {
    const sel = window.getSelection(), txt = sel ? sel.toString().trim() : "", app = document.getElementById("app");
    if (!txt || !sel.rangeCount || !app || !app.contains(sel.anchorNode)) { fab.hidden = true; return; }
    const r = sel.getRangeAt(0).getBoundingClientRect(); selTxt = txt; fab.hidden = false;
    fab.style.top = Math.min(window.innerHeight - 56, r.bottom + 14) + "px"; fab.style.left = Math.max(8, Math.min(window.innerWidth - 52, r.left + r.width / 2 - 22)) + "px";
  };
  document.addEventListener("selectionchange", () => { clearTimeout(selTm); selTm = setTimeout(upd, 120); });
  ["mousedown", "touchstart", "pointerdown"].forEach(ev => fab.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  fab.addEventListener("click", e => { e.preventDefault(); JP.speak(selTxt); });
  document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[role=button][data-act]")) { e.preventDefault(); e.target.click(); } });

  /* after every render: voice button + announce the new screen */
  JP.onRender = function (v) {
    const root = document.getElementById("app");
    if (JP.S.gate && root) { if (!JP.D.set.voice) root.insertAdjacentHTML("beforeend", '<button class="vfab on-gate" data-act="voiceOn" aria-label="Turn on voice support. Voice support reads buttons and text aloud.">' + ic("speaker") + "<span>Voice support</span></button>"); return; }
    const key = JP.S.route.name + ":" + JSON.stringify(JP.S.route.params || {}) + (JP.S.sheet ? ":sheet" + JP.S.sheet.k : "");
    if (JP.D.set.voice && root && !JP.S.neutral && !JP.S.gate) {
      root.insertAdjacentHTML("beforeend", '<button class="vfab' + (JP.S.route.name === "home" ? " hi" : "") + '" data-act="readScreen" aria-label="' + t("Read this screen aloud") + '">' + ic("speaker") + "<span>" + t("Read screen") + "</span></button>");
      if (JP._lastKey !== key) { const title = JP.S.sheet ? (JP.S.sheet.k === "help" ? t("Need help now?") : t("Choose your guide")) : (v && v.title) || ""; if (title && JP._lastKey !== undefined) JP.speak(t(title), { queue: true }); }
    }
    JP._lastKey = key;
  };

  /* =============== SUPPORT CHAT: bot + emoji reactions =============== */
  const EMOJI = ["👍", "❤️", "😂", "😮", "😢", "🙏"];
  JP.creatorLive = false;
  const push = (from, text, extra) => { const m = Object.assign({ from, text, ts: Date.now() }, extra || {}); JP.D.chat.push(m); JP.save(); return m; };
  const actBtn = a => a.tel ? '<a class="btn red sm" href="tel:' + esc(a.tel) + '" data-native="1">' + ic("phone", "sm") + esc(a.l) + "</a>"
    : '<button class="btn sec sm" data-act="' + a.act + '"' + ["id", "to", "type", "c", "tab"].map(k => a[k] ? " data-" + k + '="' + esc(a[k]) + '"' : "").join("") + ">" + esc(a.l) + "</button>";
  const bubble = (m, i) => {
    const mine = m.from === "me", lab = m.from === "creator" ? t("Creator") : mine ? "" : t("JustiPath Bot");
    const re = (m.r || []).map(e => '<span class="rchip mine" aria-label="' + t("You reacted") + " " + e + '">' + e + "</span>").join("") + (m.b || []).map(e => '<span class="rchip" aria-label="' + t("Support reacted") + " " + e + '">' + e + "</span>").join("");
    const pick = S.reactFor === i ? '<div class="rbar" role="group" aria-label="' + t("React with an emoji") + '">' + EMOJI.map(e => '<button data-act="addReact" data-i="' + i + '" data-e="' + e + '" aria-pressed="' + (m.r || []).includes(e) + '" aria-label="' + e + '">' + e + "</button>").join("") + "</div>" : "";
    return '<div class="mwrap ' + (mine ? "me" : "them") + ' rd">' + (lab ? '<span class="who">' + (m.from === "creator" ? ic("user", "sm") : ic("headset", "sm")) + esc(lab) + "</span>" : "") +
      '<div class="msg ' + (mine ? "me" : "them") + '" role="button" tabindex="0" data-act="react" data-i="' + i + '" aria-label="' + esc(m.text) + ". " + t("Tap to react") + '">' + esc(m.text) + "<small>" + fmt(m.ts) + "</small></div>" +
      ((m.a || []).length ? '<div class="acts">' + m.a.map(actBtn).join("") + "</div>" : "") + (re ? '<div class="reacts">' + re + "</div>" : "") + pick + (mine ? "" : JP.spk(t("Read aloud"))) + "</div>";
  };
  function logUpdate(keepScroll) { const l = document.getElementById("log"); if (!l) return; l.innerHTML = JP.D.chat.map(bubble).join("") + (S.typing ? '<div class="mwrap them"><div class="msg them typing" aria-label="' + t("Bot is typing") + '"><i></i><i></i><i></i></div></div>' : ""); if (!keepScroll) l.parentElement.scrollTop = l.parentElement.scrollHeight; }
  JP.A.react = el => { const i = +el.dataset.i; S.reactFor = S.reactFor === i ? null : i; logUpdate(true); };
  JP.A.addReact = el => { const m = JP.D.chat[+el.dataset.i]; if (!m) return; m.r = m.r || []; const e = el.dataset.e, k = m.r.indexOf(e); if (k >= 0) m.r.splice(k, 1); else m.r.push(e); S.reactFor = null; JP.save(); logUpdate(true); };
  JP.A.clearChat = () => { JP.D.chat = []; JP.save(); S.reactFor = null; JP.render(); };

  const botBrain = txt => {
    const low = txt.toLowerCase(), has = re => re.test(low);
    if (has(/(creator|owner|developer|human|real person|agent|tao|totoong|kausap)/)) return { text: t("I am an automatic bot. The creator replies in live chat when available (Monday to Friday, 8 AM to 5 PM). Tap the button below to talk to the creator."), a: [{ l: t("Talk to the creator"), act: "openTawk" }] };
    if (has(/(emergency|danger|help me|tulong|sinasaktan|911)/)) return { text: t("If you are in danger, call 911 now. This chat cannot send help."), a: [{ l: t("Call") + " 911", tel: "911" }] };
    const f = JP.FAQ.find(q => q.k.split(" ").some(w => w.length > 3 && low.includes(w))); if (f) return { text: f.a };
    const hit = JP.search(txt).find(o => ["guide", "office", "hotline", "law", "right"].includes(o.type));
    if (hit) return { text: t("I found something that may help:") + " " + hit.title + ".", a: [{ l: t("Open it"), act: "item", id: hit.id }, { l: t("Ask the Assistant"), act: "tab", to: "assistant" }] };
    return { text: t("Thanks for your message. I am a bot, so I may not have the answer. The creator will reply when available.") + (JP.supportOnline() ? "" : " " + t("We are offline now.")) + " " + t("For emergencies, call 911."), a: [{ l: t("Ask the Assistant"), act: "tab", to: "assistant" }, { l: t("Talk to the creator"), act: "openTawk" }] };
  };
  function botRespond(txt, idx) {
    if (JP.creatorLive) { if (!JP._creatorNote) { JP._creatorNote = true; push("creator", t("The creator joined the live chat. Please continue in the live chat window."), { a: [{ l: t("Open live chat"), act: "openTawk" }] }); logUpdate(); } return; }
    S.typing = true; logUpdate();
    setTimeout(() => {
      S.typing = false; const r = botBrain(txt); const m = push("bot", r.text, { a: r.a });
      if (/(thank|salamat|maraming)/i.test(txt) && JP.D.chat[idx]) { JP.D.chat[idx].b = ["❤️"]; JP.save(); }
      logUpdate(); if (JP.D.set.voice) JP.speak(m.text);
    }, 900 + Math.random() * 500);
  }
  JP.A.chatSend = f => { const i = f.elements.m, v = i.value.trim(); if (!v) return; const m = push("me", v); i.value = ""; S.reactFor = null; logUpdate(); botRespond(v, JP.D.chat.indexOf(m)); };
  JP.A.chatQuick = el => { const m = push("me", el.dataset.text); logUpdate(); botRespond(el.dataset.text, JP.D.chat.indexOf(m)); };
  JP.V.chat = function () {
    if (!JP.D.chat.length) push("bot", t("Hi! I am the JustiPath support bot. I answer automatically until the creator joins the chat. Tap any message to react with an emoji."), { a: [] });
    const live = JP.creatorLive, on = JP.supportOnline();
    return { title: "Support", noNav: true, after() { logUpdate(); },
      body: '<div class="note red">' + ic("alert", "sm") + "<span><b>" + t("In danger? Call 911.") + "</b> " + t("This chat is for app questions only. No legal advice. Do not share sensitive case details.") + "</span></div>" +
        '<div class="bar"><span class="badge ' + (live ? "open" : "") + '">' + ic(live ? "user" : "headset", "sm") + (live ? t("Creator is live: bot paused") : t("Bot is answering")) + '</span><span class="badge ' + (on ? "open" : "warn") + '">' + (on ? t("Support online") : t("Support offline")) + '</span></div>' +
        '<button class="btn block" data-act="openTawk">' + ic("user", "sm") + t("Talk to the creator (live chat)") + '</button>' +
        '<div class="chips">' + ["Wrong office information", "The app is not working", "How do I use JustiPath?"].map(q => '<button class="chip" data-act="chatQuick" data-text="' + esc(t(q)) + '">' + t(q) + "</button>").join("") + '</div><p class="lede" style="font-size:.78rem">' + t("Tap a message to react with an emoji.") + '</p><div class="chat" id="log"></div><button class="linkbtn" data-act="clearChat">' + t("Clear this chat") + "</button>",
      composer: '<form class="composer" data-submit="chatSend"><input id="cin" name="m" autocomplete="off" placeholder="' + esc(t("Type your message")) + '" aria-label="' + t("Type your message") + '" maxlength="500"><button class="btn" type="submit" aria-label="' + t("Send") + '">' + ic("send", "sm") + "</button></form>" };
  };

  /* =============== ASSISTANT (built-in, runs on the device) =============== */
  const CRISIS = /(kill myself|suicid|end my life|want to die|mamatay na lang|gusto kong mamatay|magpakamatay|ayoko nang mabuhay|self.?harm)/;
  const EMERG = /(emergency|in danger|danger|help me|tulungan ako|sinasaktan ako|binubugbog|papatayin|may baril|has a gun|knife|patalim|rape|ginahasa|hostage|dumudugo|bleeding|kidnap)/;
  const caseOf = q => { const toks = JP.tokens(q), sc = JP.CASES.map(c => { const h = (c.tags + " " + c.en + " " + c.fil).toLowerCase().replace(/[’']/g, ""); return { c, n: toks.filter(w => h.includes(w)).length }; }).filter(x => x.n).sort((a, b) => b.n - a.n); return sc.length ? sc[0].c : null; };
  const rows = ids => ids.map(id => JP.BY[id]).filter(Boolean);
  function aiAnswer(q) {
    const low = q.toLowerCase().replace(/[’']/g, ""), has = re => re.test(low);
    if (has(CRISIS)) return { text: t("I am really sorry you are hurting. You matter, and you do not have to face this alone. Please reach out to someone right now."), acts: [{ l: t("Call") + " NCMH 0917-899-8727", tel: "09178998727" }, { l: t("Call") + " 911", tel: "911" }] };
    const c = caseOf(q), out = { text: "", acts: [], items: [] };
    if (has(EMERG)) { out.text = t("If you or someone else is in danger, call 911 first."); out.acts.push({ l: t("Call") + " 911", tel: "911" }, { l: t("See hotlines"), act: "tab", to: "help" }); if (!c) return out; out.text += "\n\n"; }
    if (has(/^(hi|hello|hey|kumusta|musta|good (morning|afternoon|evening))\b/) && !c) return { text: t("Hello! Tell me what happened in your own words, like “my boss won’t pay me” or “na-hack ang account ko”. I will show where to go, what to bring, and what comes next."), acts: [], items: [] };
    if (has(/(thank|salamat)/) && !c) return { text: t("You are welcome. Stay safe, and ask me anything else."), acts: [], items: [] };
    if (has(/(open now|bukas|opening|hours|oras|schedule)/)) { const o = JP.OFFICES.filter(x => (!c || x.cases.includes(c.id)) && JP.status(x.hours).open).slice(0, 4); out.text += o.length ? t("These offices are open now (Philippine time):") : t("No matching office is open right now. Most open Monday to Friday, 8 AM to 5 PM. Police stations and hospitals are open 24 hours."); out.items = o.map(x => x.id); return out; }
    if (has(/(hotline|numero|number|tawag|call|contact)/)) { const h = JP.HOTLINES.filter(x => !c || x.cases.includes(c.id)).sort((a, b) => b.em - a.em).slice(0, 4); out.text += t("Here are hotlines you can call:"); out.items = h.map(x => x.id); out.acts.push({ l: t("See all hotlines"), act: "list", type: "hotline" }); return out; }
    if (c) {
      const g = JP.GUIDES.find(x => x.cases[0] === c.id), r = JP.REQS.find(x => x.cases[0] === c.id), name = c[JP.lang()];
      if (has(/(bring|dala|requirement|document|kailangan|checklist|papel)/)) { out.text += t("For") + " " + name + ", " + t("bring these:") + "\n• " + r.items.slice(0, 6).join("\n• "); out.acts.push({ l: t("Open checklist"), act: "case", id: c.id, tab: "checklist" }); return out; }
      if (has(/(right|karapatan)/)) { out.text += t("Your rights in") + " " + name + ":"; out.items = JP.RIGHTS.filter(x => x.cases.includes(c.id)).slice(0, 4).map(x => x.id); return out; }
      if (has(/(law|batas|\bra\b)/)) { out.text += t("Laws that apply to") + " " + name + ":"; out.items = JP.LAWS.filter(x => x.cases.includes(c.id)).slice(0, 4).map(x => x.id); return out; }
      if (has(/(where|saan|office|institution|punta|go to)/)) { out.text += t("Where to go for") + " " + name + ":"; out.items = JP.OFFICES.filter(x => x.cases.includes(c.id)).slice(0, 4).map(x => x.id); return out; }
      out.text += t("This sounds like") + " **" + name + "**.\n" + t("Start here") + ": " + c.first[JP.lang()] + ".\n\n" + g.steps.slice(0, 3).map((s, i) => (i + 1) + ". " + s.t + ": " + s.d).join("\n") + "\n\n" + t("This is general information, not legal advice.");
      out.acts.push({ l: t("Full guide"), act: "case", id: c.id, tab: "guide" }, { l: t("Checklist"), act: "case", id: c.id, tab: "checklist" }, { l: t("Hotlines"), act: "case", id: c.id, tab: "hotline" });
      out.items = JP.OFFICES.filter(x => x.cases.includes(c.id)).slice(0, 2).map(x => x.id); return out;
    }
    const hits = JP.search(q).slice(0, 4);
    if (hits.length) { out.text += t("Here is what I found in the JustiPath library:"); out.items = hits.map(x => x.id); return out; }
    out.text += t("I could not match that yet. Try plain words like “boss won’t pay me”, “nanakawan ako”, “na-hack ang account”, or pick a case:"); JP.CASES.forEach(x => out.acts.push({ l: x[JP.lang()].split(" /")[0], act: "case", id: x.id, tab: "guide" })); return out;
  }
  const aiBubble = m => {
    if (m.role === "user") return '<div class="mwrap me"><div class="msg me">' + esc(m.text) + "<small>" + fmt(m.ts) + "</small></div></div>";
    const items = (m.items || []).map(id => JP.BY[id]).filter(Boolean).map(o => '<button class="airow" data-act="item" data-id="' + o.id + '"><b>' + esc(o.title) + "</b><small>" + esc(o.type === "hotline" ? o.num : (JP.itemSub(o) || "").slice(0, 90)) + "</small></button>").join("");
    return '<div class="mwrap them rd"><span class="who">' + ic("spark", "sm") + t("Assistant") + '</span><div class="msg them">' + rich(m.text) + (items ? '<div class="aitems">' + items + "</div>" : "") + "<small>" + fmt(m.ts) + "</small></div>" + ((m.acts || []).length ? '<div class="acts">' + m.acts.map(actBtn).join("") + "</div>" : "") + JP.spk(t("Read aloud")) + "</div>";
  };
  function aiUpdate() { const l = document.getElementById("ailog"); if (!l) return; l.innerHTML = JP.D.ai.map(aiBubble).join("") + (S.aiTyping ? '<div class="mwrap them"><div class="msg them typing"><i></i><i></i><i></i></div></div>' : ""); l.parentElement.scrollTop = l.parentElement.scrollHeight; }
  function aiAsk(q) {
    JP.D.ai.push({ role: "user", text: q, ts: Date.now() }); S.aiTyping = true; aiUpdate();
    setTimeout(() => { S.aiTyping = false; const a = aiAnswer(q); JP.D.ai.push({ role: "bot", text: a.text, acts: a.acts, items: a.items, ts: Date.now() }); if (JP.D.ai.length > 60) JP.D.ai = JP.D.ai.slice(-60); JP.save(); aiUpdate(); if (JP.D.set.voice) JP.speak(a.text.replace(/\*\*/g, "")); }, 700);
  }
  JP.A.aiSend = f => { const i = f.elements.m, v = i.value.trim(); if (!v) return; i.value = ""; aiAsk(v); };
  JP.A.aiQuick = el => aiAsk(el.dataset.text);
  JP.A.aiClear = () => { JP.D.ai = []; JP.save(); JP.render(); };
  JP.V.assistant = function () {
    if (!JP.D.ai.length) JP.D.ai.push({ role: "bot", text: t("Hi! I am the JustiPath Assistant. Tell me what happened in your own words and I will show where to go, what to bring, and what comes next."), acts: [], items: [], ts: Date.now() });
    const qs = ["My boss won’t pay me", "Nanakawan ako ng phone", "Na-hack ang account ko", "My partner hurts me", "Hotline numbers", "Offices open now"];
    return { title: "Assistant", after() { aiUpdate(); },
      body: '<div class="card" style="flex-direction:row;gap:12px;align-items:center"><span class="ibox">' + ic("spark") + '</span><div style="min-width:0"><h2 class="h2">' + t("JustiPath Assistant") + '</h2><p class="lede" style="font-size:.8rem">' + t("Answers come from JustiPath’s built-in library of rights, laws, offices and hotlines. It is not legal advice.") + '</p></div></div>' +
        '<div class="chips">' + qs.map(q => '<button class="chip" data-act="aiQuick" data-text="' + esc(t(q)) + '">' + esc(t(q)) + "</button>").join("") + '</div><div class="chat" id="ailog"></div><button class="linkbtn" data-act="aiClear">' + t("Clear this chat") + "</button>",
      composer: '<form class="composer" data-submit="aiSend"><input id="ain" name="m" autocomplete="off" placeholder="' + esc(t("Ask in plain words")) + '" aria-label="' + t("Ask in plain words") + '" maxlength="300"><button class="btn" type="submit" aria-label="' + t("Send") + '">' + ic("send", "sm") + "</button></form>" };
  };
  window.addEventListener("online", () => {});
})();

</script>
<script>
/* JustiPath boot: privacy consent first, then log in or continue as guest. */
(function () {
  const JP = window.JP;
  const start = () => { JP.S.gate = !JP.D.consent ? "consent" : (JP.D.session || JP.D.guest) ? null : "auth"; JP.S.authMode = "login"; JP.render(); };
  Promise.race([JP.restore(), new Promise(r => setTimeout(r, 800))]).then(start, start);
})();

</script>
</body>
